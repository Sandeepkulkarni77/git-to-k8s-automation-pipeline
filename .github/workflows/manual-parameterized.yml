name: Parameterized Manual Workflow

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: "Application name"
        required: true
        type: string
      run_validation:
        description: "Run validation"
        required: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validation.outputs.validation_status }}

    steps:
      - name: Validate inputs
        id: validation
        run: |
          echo "Application: ${{ inputs.application_name }}"
          echo "Run validation: ${{ inputs.run_validation }}"

          if [ "${{ inputs.run_validation }}" = "true" ]; then
            echo "Validation successful"
            echo "validation_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Validation skipped"
            echo "validation_status=skipped" >> "$GITHUB_OUTPUT"
          fi

  summary:
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Execution summary
        run: |
          echo "Application ${{ inputs.application_name }} passed validation."
          echo "Final execution summary completed successfully."
